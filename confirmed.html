<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM Email Confirmed</title>
<style>
  :root {
    --background: #0A0A0A;
    --surface: #141414;
    --surface-raised: #1C1C1C;
    --accent: #C6FF00;
    --accent-secondary: #7CFF4D;
    --text-primary: #FFFFFF;
    --text-secondary: #A1A1A1;
    --divider: #1F1F1F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--accent-secondary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 30px;
    margin: 24px 0 8px;
  }
  .subtitle {
    color: var(--text-secondary);
    margin-bottom: 40px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 17px;
    margin: 0 0 8px;
  }
  .card p {
    color: var(--text-secondary);
    margin: 0;
  }
  a.button {
    display: inline-block;
    margin-top: 8px;
    background: linear-gradient(90deg, var(--accent-secondary), var(--accent));
    color: #0A0A0A;
    font-weight: 700;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
  }
  details {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  summary {
    cursor: pointer;
    font-weight: 600;
  }
  details p {
    color: var(--text-secondary);
    margin: 12px 0 0;
  }
  footer {
    margin-top: 48px;
    color: var(--text-secondary);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">PRISM</div>
    <h1 id="title">You're confirmed</h1>
    <p class="subtitle" id="message">Your email address is verified. Go back to the PRISM app and sign in with your email and password.</p>
    <footer>© 2026 Grant Schultz · <a href="privacy.html" style="color: var(--accent)">Privacy Policy</a></footer>
  </div>
<script>
  // Supabase reports a failed link (e.g. expired) in the URL. Show that
  // instead of claiming success, then strip tokens from the address bar.
  (function () {
    var params = new URLSearchParams(location.hash.slice(1) + "&" + location.search.slice(1));
    var problem = params.get("error_description");
    if (problem) {
      document.title = "PRISM Link Problem";
      document.getElementById("title").textContent = "This link didn't work";
      document.getElementById("message").textContent = problem.replace(/\+/g, " ") +
        ". Open the PRISM app and sign in. If your email still isn't confirmed, sign up again to get a new link.";
    }
    if (location.search || location.hash) history.replaceState(null, "", location.pathname);
  })();
</script>
</body>
</html>
